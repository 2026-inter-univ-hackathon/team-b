<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>リケイアラーム</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-state="setup">
<main>

  <!-- 待機: 時刻設定 -->
  <section id="setup">
    <h1>リケイアラーム</h1>
    <p class="lead">理系の問題を解かないと止まらない目覚まし</p>

    <label for="alarm-time">鳴らす時刻</label>
    <input id="alarm-time" type="time" value="07:30">

    <fieldset id="genres">
      <legend>出題ジャンル</legend>
      <label><input type="checkbox" name="genre" value="math" checked> 数学</label>
      <label><input type="checkbox" name="genre" value="physics"> 物理</label>
      <label><input type="checkbox" name="genre" value="code" checked> プログラミング</label>
    </fieldset>

    <div class="row">
      <button id="btn-set" class="primary">セット</button>
      <button id="btn-demo">10秒後に鳴らす</button>
    </div>

    <details class="check">
      <summary>動作確認（開発用）</summary>
      <div class="row">
        <button id="btn-check-beep">ビープを1秒鳴らす</button>
        <button id="btn-check-storage">localStorage を確認</button>
      </div>
      <p id="check-result" class="muted">未確認</p>
    </details>
  </section>

  <!-- 監視中: カウントダウン -->
  <section id="armed">
    <div id="now" class="clock">--:--:--</div>
    <p id="countdown" class="lead">-- まであと --</p>
    <p class="muted">タブを前面にしたまま寝てください。バックグラウンドだと数十秒遅れることがあります。</p>
    <p id="missed" class="note" hidden>
      <span id="missed-text"></span>
      <button id="btn-ring-now" type="button">今すぐ鳴らす</button>
      <button id="btn-ring-tomorrow" type="button">明日にする</button>
    </p>
    <p id="armed-note" class="note" hidden>
      リロード後は音の許可が切れています。<button id="btn-enable-sound" type="button">音を有効にする</button> を押してください。
    </p>
    <button id="btn-disarm">解除</button>
  </section>

  <!-- 鳴動: 問題 -->
  <section id="ringing">
    <p class="eyebrow">起きろ。正解するまで止まらない</p>
    <div id="question" class="question">問題を読み込み中…</div>
    <form id="answer-form" autocomplete="off">
      <input id="answer" type="text" inputmode="numeric" placeholder="数値で答える" required>
      <button type="submit" class="primary">答える</button>
    </form>
    <p id="attempts" class="muted">1問目</p>
  </section>

  <!-- 停止: ログ -->
  <section id="done">
    <h1>起床成功</h1>
    <p id="result" class="lead"></p>
    <p id="weekly" class="muted"></p>
    <ul id="log" class="log"></ul>
    <button id="btn-again" class="primary">明日もセット</button>
  </section>

</main>

<!-- type="module" は file:// で CORS エラーになりうるので通常の script を順に読む -->
<script src="problems.js"></script>
<script src="app.js"></script>
</body>
</html>
