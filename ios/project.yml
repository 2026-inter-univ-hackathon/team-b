name: ZekkiHelper
options:
  bundleIdPrefix: jp.zekkihelper
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_KEY_CFBundleDisplayName: 絶起ヘルパー
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_NSSupportsLiveActivities: YES
targets:
  ZekkiHelper:
    type: application
    platform: iOS
    sources:
      - path: ZekkiHelper
      - path: ../js/problems.js
        buildPhase: resources
    info:
      path: ZekkiHelper/Info.plist
      properties:
        CFBundleDisplayName: 絶起ヘルパー
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        NSAlarmKitUsageDescription: 設定した起床時刻と帰宅前の時刻にアラームでお知らせします。
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.zekkihelper.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  ZekkiHelper:
    build:
      targets:
        ZekkiHelper: all
